
<!--
FILE: components/header/header.html
WHAT: Displays the website header.
WHY: Contains the logo, navigation, saved count, and login.
-->

<header class="header">

  <!-- German tricolor -->
  <div class="tricolor" aria-hidden="true">
    <span class="band band--ink"></span>
    <span class="band band--red"></span>
    <span class="band band--gold"></span>
  </div>

  <div class="header__inner">

    <!-- Logo and title -->
    <a class="brand" routerLink="/" aria-label="GIU Yearbook, go to home">

      @if (!logoFailed()) {
        <img
          class="brand__logo"
          src="images/giu-logo.png"
          alt="German International University"
          (error)="logoFailed.set(true)"
        >
      } @else {
        <span class="brand__fallback">GIU</span>
      }

      <span class="brand__text">
        <strong>German International University</strong>
        <small>YEARBOOK / 2028</small>
      </span>

    </a>

    <!-- Navigation -->
    <nav class="nav" aria-label="Main">

      @for (link of navLinks; track link.path) {
        <a
          class="nav__link"
          [routerLink]="link.path"
          routerLinkActive="nav__link--active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
        >
          {{ link.label }}
        </a>
      }

    </nav>

    <!-- Saved counter and login -->
    <div class="header__actions">

      <p class="header__saved" aria-live="polite">
        Saved
        <span class="header__count">
          {{ saved.count() }}
        </span>
      </p>

      <a class="btn header__login" routerLink="/login">
        Student login
        <img
          src="icons/arrow-up-right.svg"
          alt=""
          aria-hidden="true"
        />
      </a>

    </div>

  </div>

</header>
